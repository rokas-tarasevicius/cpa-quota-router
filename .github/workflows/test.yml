name: test

on:
  push:
  pull_request:

permissions:
  contents: read

# Self-hosted runners on agentbox: the repository has to be listed in /etc/agentbox/ci.conf there.
# Elsewhere, ubuntu-latest works as is.
jobs:
  unit:
    runs-on: agentbox
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python ${{ matrix.python }} python -m unittest -v

  e2e:
    runs-on: agentbox
    env:
      CPA_VERSION: 8.0.44
      CPA_SHA256_AMD64: 3957c34fe4a95a37f5997ab63d78dca431fa1521997d7c2ab3bdfe169ad89307
      CPA_SHA256_AARCH64: 2793502b5cf910528f797d2392c49ec9e87f5e7cc16db4c7bec7cb6a23370528
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Download CLIProxyAPI
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64; sha="$CPA_SHA256_AMD64" ;;
            aarch64) arch=aarch64; sha="$CPA_SHA256_AARCH64" ;;
            *) echo "no CLIProxyAPI build for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o cpa.tar.gz \
            "https://github.com/router-for-me/CLIProxyAPI/releases/download/v${CPA_VERSION}/CLIProxyAPI_${CPA_VERSION}_linux_${arch}.tar.gz"
          echo "${sha}  cpa.tar.gz" | sha256sum -c -
          mkdir cpa && tar -xzf cpa.tar.gz -C cpa
      - run: uv run --no-project --python 3.13 python e2e/run_e2e.py cpa/cli-proxy-api
