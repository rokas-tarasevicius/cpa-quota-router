name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python ${{ matrix.python }} python -m unittest -v

  e2e:
    name: e2e (CLIProxyAPI ${{ matrix.cpa }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # the oldest release tested
          - cpa: 8.0.44
            sha256_amd64: 3957c34fe4a95a37f5997ab63d78dca431fa1521997d7c2ab3bdfe169ad89307
            sha256_aarch64: 2793502b5cf910528f797d2392c49ec9e87f5e7cc16db4c7bec7cb6a23370528
          # the newest release tested, which the installer puts on a new machine
          - cpa: 8.0.48
            sha256_amd64: 095c46e7165842cf563f9665be86cf24a29ba94e57ab9bd67588fe5cc4c7125c
            sha256_aarch64: 9ed7c06aa96d9cc6736ddfc897de07b8b6085731785087f6701f07ec9ec198dd
    env:
      CPA_VERSION: ${{ matrix.cpa }}
      CPA_SHA256_AMD64: ${{ matrix.sha256_amd64 }}
      CPA_SHA256_AARCH64: ${{ matrix.sha256_aarch64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Download CLIProxyAPI
        run: |
          case "$(uname -m)" in
            x86_64) arch=amd64; sha="$CPA_SHA256_AMD64" ;;
            aarch64) arch=aarch64; sha="$CPA_SHA256_AARCH64" ;;
            *) echo "no CLIProxyAPI build for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o cpa.tar.gz \
            "https://github.com/router-for-me/CLIProxyAPI/releases/download/v${CPA_VERSION}/CLIProxyAPI_${CPA_VERSION}_linux_${arch}.tar.gz"
          echo "${sha}  cpa.tar.gz" | sha256sum -c -
          mkdir cpa && tar -xzf cpa.tar.gz -C cpa
      - run: uv run --no-project --python 3.13 python e2e/run_e2e.py cpa/cli-proxy-api
